name: ev_charger
description: "A new Flutter project." 
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
 
version: 1.0.2+15

environment:
  sdk: ^3.8.1
 
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # bloc
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0

  flutter_svg: ^2.0.17
  flutter_launcher_icons: ^0.14.3
  
  http: ^1.6.0

  # OTP
  pinput: ^5.0.1
  timer_count_down: ^2.2.2

  # date month
  month_year_picker: ^0.5.0+1

  flutter_localization: ^0.3.3

  # MAPS
  google_maps_flutter_android: ^2.18.3

  intl: ^0.20.2

  # language
  easy_localization: ^3.0.8

  toggle_switch: ^2.3.0

  # storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  equatable: ^2.0.8

  # json model
  json_annotation: ^4.9.0

  # location
  location: ^8.0.0
  geolocator: ^13.0.2
  latlong2: ^0.9.1 

  # MAP
  flutter_map: ^8.2.2
  mapbox_maps_flutter: ^2.19.1

  # SCANNER QR
  mobile_scanner: ^7.2.0 

  # camera / image
  image_cropper: ^11.0.0 
  extended_image: ^9.1.0
  image_picker: ^1.1.2

  get_it: ^9.2.1
  navigation_history_observer: ^1.1.1
  connectivity_plus: ^7.0.0
  font_awesome_flutter: ^10.9.1
  map_launcher: ^3.5.0
  flutter_inappwebview: ^6.1.5
  fluttertoast: ^9.0.0

  # NOTIFICATION
  flutter_local_notifications: ^19.1.0

  # FIREBASE
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.10
  
  shimmer: ^3.0.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  json_serializable: ^6.8.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/
    - assets/icon/success_circle.png 
    - assets/logo/
    - assets/logo/app_logo.png
    - assets/language/
    - assets/image/

 
  fonts:
    - family: Segoe
      fonts:
        - asset: assets/fonts/Segoe/Segoe UI.ttf
          weight: 500
        - asset: assets/fonts/Segoe/Segoe UI Bold.ttf
          weight: 700
 
