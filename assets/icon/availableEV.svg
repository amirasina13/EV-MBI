<svg 
xmlns="http://www.w3.org/2000/svg"
width="80"
height="80"
viewBox="0 0 24 24"
fill="none"
stroke="#2D8659"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<!-- Charger body -->
<rect x="7" y="4" width="10" height="14" rx="2" fill="#E8F5E9"></rect>

<!-- Screen -->
<rect x="9" y="7" width="6" height="4" rx="1" fill="#2D8659" opacity="0.15"></rect>

<!-- Charging port -->
<circle cx="12" cy="14" r="1.2" fill="#2D8659"></circle>

<!-- Cable -->
<path d="M12 16 L12 20"></path>

<!-- Plug tip -->
<circle cx="12" cy="20" r="1" fill="#2D8659"></circle>

<!-- Status badge -->
<circle cx="15" cy="6" r="2.5" fill="#2D8659"></circle>

<!-- Check mark -->
<path d="M13.8 6 L14.5 6.7 L16.2 5"
stroke="white"
stroke-width="1.5"
fill="none"></path>

</svg>