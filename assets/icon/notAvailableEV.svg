<svg
xmlns="http://www.w3.org/2000/svg"
width="80"
height="80"
viewBox="0 0 24 24"
fill="none"
stroke="#9E9E9E"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<!-- Charger body -->
<rect x="7" y="4" width="10" height="14" rx="2" fill="#F5F5F5"></rect>

<!-- Screen -->
<rect x="9" y="7" width="6" height="4" rx="1" fill="#9E9E9E" opacity="0.15"></rect>

<!-- Port -->
<circle cx="12" cy="14" r="1.2" fill="#9E9E9E"></circle>

<!-- Cable -->
<path d="M12 16 L12 20" stroke-dasharray="2 2"></path>

<!-- Plug -->
<circle cx="12" cy="20" r="1" fill="#9E9E9E"></circle>

<!-- Error badge -->
<circle cx="15" cy="6" r="2.5" fill="#FF6B6B"></circle>

<!-- X mark -->
<line x1="14" y1="5" x2="16" y2="7" stroke="white" stroke-width="1.5"></line>
<line x1="16" y1="5" x2="14" y2="7" stroke="white" stroke-width="1.5"></line>

</svg>