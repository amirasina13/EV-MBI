<svg
xmlns="http://www.w3.org/2000/svg"
width="80"
height="80"
viewBox="0 0 24 24"
fill="none"
stroke="#4A90E2"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">
<!-- Charger body -->
<rect x="7" y="4" width="10" height="14" rx="2" fill="#E3F2FD"></rect>
<!-- Screen -->
<rect x="9" y="7" width="6" height="4" rx="1" fill="#4A90E2" opacity="0.3"></rect>
<!-- Port -->
<circle cx="12" cy="14" r="1.2" fill="#4A90E2"></circle>
<!-- Cable -->
<path d="M12 16 L12 20" stroke-width="2.5"></path>
<!-- Plug -->
<circle cx="12" cy="20" r="1.2" fill="#4A90E2"></circle>
<!-- Status badge -->
<circle cx="15" cy="6" r="2.5" fill="#4A90E2"></circle>
<!-- Lightning -->
<path d="M15.8 4.5 L14.5 6.5 L15.2 6.5 L14.2 7.5"
stroke="white"
stroke-width="1.2"
